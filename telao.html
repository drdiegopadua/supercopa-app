<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SUPERCOPA AFC 2026 — Telão</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#050b1a;--navy2:#0a1530;--blue:#1565C0;--blue2:#0D47A1;--gold:#C8960C;--gold2:#F4C542;--orange:#F57C00;--txt:#eef4ff;--muted:rgba(238,244,255,.6);--A:#2f86ff;--B:#ff8a1f}
html,body{height:100%;background:#000;overflow:hidden;font-family:'Barlow Condensed','Segoe UI',sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--navy);overflow:hidden}

/* fundo */
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 60% 55% at 22% 40%,rgba(47,134,255,.30),transparent 62%),
 radial-gradient(ellipse 60% 55% at 78% 40%,rgba(255,138,31,.24),transparent 62%),
 radial-gradient(ellipse 50% 30% at 50% 0%,rgba(244,197,66,.18),transparent 70%),
 linear-gradient(180deg,#07102a 0%,#050b1a 100%)}
.bg::after{content:"";position:absolute;inset:0;background:
 repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 46px);opacity:.8}
.court-lines{position:absolute;left:50%;bottom:-120px;width:1500px;height:620px;transform:translateX(-50%) perspective(900px) rotateX(58deg);border:4px solid rgba(255,255,255,.07);opacity:.9}
.court-lines::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:rgba(255,255,255,.07)}
.light{position:absolute;top:-200px;width:460px;height:1500px;filter:blur(40px);opacity:.22;transform-origin:50% 0}
.light.l1{left:140px;background:linear-gradient(180deg,#2f86ff,transparent 70%);transform:rotate(18deg);animation:sway 9s ease-in-out infinite alternate}
.light.l2{right:140px;background:linear-gradient(180deg,#ff8a1f,transparent 70%);transform:rotate(-18deg);animation:sway 11s ease-in-out infinite alternate-reverse}
@keyframes sway{to{transform:rotate(0deg)}}

/* topo */
.top{position:absolute;left:0;right:0;top:0;height:132px;display:flex;align-items:center;padding:0 64px;gap:28px;background:linear-gradient(180deg,rgba(5,11,26,.92),rgba(5,11,26,0))}
.top img{width:92px;height:92px;border-radius:22px;box-shadow:0 0 0 3px rgba(244,197,66,.65),0 10px 30px rgba(0,0,0,.5)}
.brand{line-height:1}
.brand b{display:block;font-family:Anton,sans-serif;font-weight:400;font-size:50px;letter-spacing:3px;background:linear-gradient(180deg,#fff,#cfe0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{font-size:26px;letter-spacing:7px;color:var(--gold2);font-weight:700}
.where{margin-left:auto;text-align:right;line-height:1.05}
.where b{display:block;font-size:40px;font-weight:800;letter-spacing:3px}
.where span{font-size:26px;color:var(--muted);letter-spacing:3px;font-weight:600}
.live{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#ff3b30,#c0201a);padding:10px 26px;border-radius:99px;font-size:34px;font-weight:800;letter-spacing:5px;box-shadow:0 0 0 0 rgba(255,59,48,.7);animation:pulse 1.8s infinite}
.live i{width:16px;height:16px;border-radius:50%;background:#fff}
.live.fim{background:linear-gradient(180deg,#22c55e,#15803d);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(255,59,48,0)}100%{box-shadow:0 0 0 0 rgba(255,59,48,0)}}

/* placar */
.board{position:absolute;left:64px;right:64px;top:150px;height:470px;display:grid;grid-template-columns:1fr 680px 1fr;gap:0;align-items:stretch}
.team{position:relative;border-radius:34px;padding:34px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
.team.A{background:linear-gradient(160deg,rgba(47,134,255,.38),rgba(13,71,161,.20) 60%);border:2px solid rgba(47,134,255,.55)}
.team.B{background:linear-gradient(200deg,rgba(255,138,31,.34),rgba(150,70,0,.18) 60%);border:2px solid rgba(255,138,31,.55)}
.team::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%);pointer-events:none}
.escudo{width:190px;height:190px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 7px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.45);flex-shrink:0}
.escudo img{width:100%;height:100%;object-fit:cover}
.escudo span{font-family:Anton,sans-serif;font-size:84px;letter-spacing:2px}
.team.A .escudo span{color:var(--blue2)}.team.B .escudo span{color:#b45309}
.nome{font-family:Anton,sans-serif;font-weight:400;font-size:56px;line-height:1.02;text-align:center;letter-spacing:1.5px;text-transform:uppercase;text-shadow:0 4px 18px rgba(0,0,0,.5);max-width:100%}
.sets{display:flex;gap:12px}
.sets i{flex-shrink:0;width:86px;height:34px;border-radius:99px;border:3px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;font-weight:800;letter-spacing:2px;color:rgba(255,255,255,.5)}
.sets i.won{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold2);color:#1a1200}
.sets i.cur{border-color:#fff;color:#fff;box-shadow:0 0 22px rgba(255,255,255,.55)}
.saque{position:absolute;top:22px;right:26px;font-size:30px;font-weight:800;letter-spacing:3px;background:var(--gold2);color:#1a1200;padding:6px 18px;border-radius:99px;display:none;align-items:center;gap:8px;animation:bounce 1.1s ease-in-out infinite}
.team.serve .saque{display:flex}
@keyframes bounce{50%{transform:translateY(-8px)}}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.setlbl{font-size:40px;font-weight:800;letter-spacing:9px;color:var(--gold2)}
.score{display:flex;align-items:center;justify-content:center;gap:6px;font-family:Anton,sans-serif;line-height:1;margin-top:2px}
.score b{font-weight:400;font-size:250px;min-width:200px;text-align:center;text-shadow:0 10px 0 rgba(0,0,0,.35),0 0 70px rgba(255,255,255,.18)}
.score b.A{color:#bcd9ff}.score b.B{color:#ffd7ae}
.score s{text-decoration:none;font-size:110px;color:var(--gold2);opacity:.9}
.score b.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.4);color:#fff;text-shadow:0 0 90px #fff}100%{transform:scale(1)}}
.setsgrande{font-size:40px;font-weight:700;letter-spacing:5px;color:var(--muted);margin-top:4px}
.setsgrande em{font-style:normal;color:#fff;font-weight:800}
.parc{font-size:28px;font-weight:600;letter-spacing:3px;color:var(--muted);margin-top:2px}

/* quadras */
.courts{position:absolute;left:64px;right:64px;top:640px;height:300px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cc{border-radius:28px;padding:16px 20px;position:relative}
.cc.A{background:linear-gradient(180deg,rgba(47,134,255,.18),rgba(5,11,26,.5));border:2px solid rgba(47,134,255,.4)}
.cc.B{background:linear-gradient(180deg,rgba(255,138,31,.16),rgba(5,11,26,.5));border:2px solid rgba(255,138,31,.4)}
.cc h4{font-size:24px;letter-spacing:5px;font-weight:800;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.cc h4 span{color:var(--gold2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.p{position:relative;height:100px;border-radius:18px;background:rgba(255,255,255,.95);color:#0a1530;display:flex;align-items:center;gap:12px;padding:0 14px;box-shadow:0 8px 18px rgba(0,0,0,.35);overflow:hidden}
.p .n{font-family:Anton,sans-serif;font-size:58px;line-height:1;min-width:64px;text-align:center}
.cc.A .p .n{color:var(--blue2)}.cc.B .p .n{color:#c2410c}
.p .t{font-size:27px;font-weight:700;line-height:1.02;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.p.sq{background:linear-gradient(180deg,#ffe28a,var(--gold2));box-shadow:0 0 0 4px #fff,0 0 34px rgba(244,197,66,.8)}
.p.sq::after{content:"SAQUE";position:absolute;right:10px;top:6px;font-size:16px;letter-spacing:2px;font-weight:800;color:#6b4a00}
.p .c{position:absolute;right:10px;bottom:6px;width:30px;height:30px;border-radius:50%;background:#0a1530;color:#fff;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center}
.p.vazio{background:rgba(255,255,255,.08);box-shadow:none}

/* faixa de lances + rodapé */
.ticker{position:absolute;left:64px;right:64px;top:958px;height:62px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:22px;padding:0 32px;font-size:32px;font-weight:700;letter-spacing:2px}
.ticker b{color:var(--gold2);font-weight:800;letter-spacing:5px;font-size:26px}
.ticker .ev{opacity:1;transition:opacity .4s}
.ticker .ev.off{opacity:0}
.arb{margin-left:auto;font-size:24px;color:var(--muted);letter-spacing:2px;font-weight:600}
.spons{position:absolute;left:0;right:0;bottom:0;height:44px;background:linear-gradient(90deg,var(--blue2),var(--blue),var(--blue2));display:flex;align-items:center;justify-content:center;gap:70px;font-size:22px;letter-spacing:6px;font-weight:700;color:rgba(255,255,255,.85)}
.spons img{height:30px}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(ellipse at center,rgba(5,11,26,.92),rgba(5,11,26,.98))}
.ov.on{display:flex;animation:fadeIn .5s both}
@keyframes fadeIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
.ov .k{font-size:44px;font-weight:800;letter-spacing:14px;color:var(--gold2)}
.ov .big{font-family:Anton,sans-serif;font-size:210px;line-height:1.05;text-align:center;text-shadow:0 12px 0 rgba(0,0,0,.35)}
.ov .sub{font-size:58px;font-weight:700;letter-spacing:4px;color:#fff;text-align:center;margin-top:8px}
.ov .trofeu{font-size:150px;line-height:1.15;margin-bottom:14px;animation:bounce 1.4s ease-in-out infinite}
canvas#conf{position:absolute;inset:0;z-index:25;pointer-events:none}

/* espera */
.idle{position:absolute;left:64px;right:64px;top:150px;bottom:70px;display:none;grid-template-columns:1.35fr 1fr;gap:40px}
.idle.on{display:grid}
.box{border-radius:34px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);padding:34px 40px}
.box h3{font-family:Anton,sans-serif;font-weight:400;font-size:56px;letter-spacing:3px;color:var(--gold2);margin-bottom:18px}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:16px 0;border-top:2px solid rgba(255,255,255,.1);font-size:42px;font-weight:700;text-transform:uppercase}
.res:first-of-type{border-top:0}
.res .a{text-align:right}.res .sc{font-family:Anton,sans-serif;font-size:60px;color:var(--gold2);letter-spacing:3px}
.res .w{color:#fff}.res .l{color:rgba(255,255,255,.5)}
.qrbox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px}
.qrbox canvas{background:#fff;padding:22px;border-radius:26px;box-shadow:0 0 0 8px rgba(244,197,66,.6),0 20px 50px rgba(0,0,0,.5)}
.qrbox b{font-family:Anton,sans-serif;font-weight:400;font-size:64px;letter-spacing:2px}
.qrbox span{font-size:36px;color:var(--muted);letter-spacing:3px;font-weight:600}
.vazio-msg{font-size:40px;color:var(--muted);letter-spacing:3px;padding:30px 0}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="light l1"></div><div class="light l2"></div><div class="court-lines"></div>

  <div class="top">
    <img src="pwa-icon-512.png" alt="">
    <div class="brand"><b>SUPERCOPA AFC</b><span>2026 · AFONSO CLÁUDIO-ES</span></div>
    <div class="where"><b id="onde">VÔLEI</b><span id="rodada"></span></div>
    <div class="live" id="selo"><i></i><span id="seloTxt">AO VIVO</span></div>
  </div>

  <div id="jogo">
    <div class="board">
      <div class="team A" id="tA"><div class="saque">🏐 SAQUE</div><div class="escudo" id="escA"></div><div class="nome" id="nomeA"></div><div class="sets" id="setsA"></div></div>
      <div class="center">
        <div class="setlbl" id="setlbl">SET 1</div>
        <div class="score"><b class="A" id="pA">0</b><s>×</s><b class="B" id="pB">0</b></div>
        <div class="setsgrande" id="setsGrande"></div>
        <div class="parc" id="parc"></div>
      </div>
      <div class="team B" id="tB"><div class="saque">🏐 SAQUE</div><div class="escudo" id="escB"></div><div class="nome" id="nomeB"></div><div class="sets" id="setsB"></div></div>
    </div>
    <div class="courts">
      <div class="cc A"><h4><span id="ccNomeA"></span><em style="font-style:normal">EM QUADRA</em></h4><div class="grid" id="qA"></div></div>
      <div class="cc B"><h4><span id="ccNomeB"></span><em style="font-style:normal">EM QUADRA</em></h4><div class="grid" id="qB"></div></div>
    </div>
    <div class="ticker"><b>LANCE</b><span class="ev" id="ev">Aguardando o início da partida</span><span class="arb" id="arb"></span></div>
  </div>

  <div class="idle" id="idle">
    <div class="box"><h3>ÚLTIMOS RESULTADOS</h3><div id="resultados"></div></div>
    <div class="box qrbox"><canvas id="qr" width="10" height="10"></canvas><b>ACOMPANHE PELO APP</b><span>Placar ao vivo, súmulas e mais</span></div>
  </div>

  <div class="ov" id="ovSet"><div class="k" id="ovSetK">SET ENCERRADO</div><div class="big" id="ovSetBig"></div><div class="sub" id="ovSetSub"></div></div>
  <div class="ov" id="ovFim"><div class="trofeu">🏆</div><div class="k">VENCEDOR</div><div class="big" id="ovFimBig"></div><div class="sub" id="ovFimSub"></div></div>
  <canvas id="conf" width="1920" height="1080"></canvas>

  <div class="spons" id="spons"><span>APOIO · PATROCÍNIO · REALIZAÇÃO</span></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwTT4C5NQ6awTRsdzl-t__mKxK0LdMlUKoPVxla43Xj5k_BsKoS5PJGIk-4wNJuDe0Kw/exec";
const APP_URL = "https://drdiegopadua.github.io/supercopa-app/";
const Q = new URLSearchParams(location.search);
const FORCE_ID = (Q.get('jogo') || '').toUpperCase();
const DEMO = Q.has('demo');
const IDLE = Q.has('espera');

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  const st = $('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
  st.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

let escudos = {};
async function carregarEscudos() {
  try {
    const r = await fetch(SCRIPT_URL + '?action=equipesComPin').then(x => x.json());
    ((r && r.equipes) || []).forEach(e => { if (e.escudo) escudos[String(e.equipe).toLowerCase()] = e.escudo; });
  } catch (e) {}
}
function escudoHtml(nome) {
  const u = escudos[String(nome).toLowerCase()];
  const ini = String(nome).replace(/[^A-Za-zÀ-ú ]/g, '').split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase() || '?';
  return u ? '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'<span>' + ini + '</span>\'">' : '<span>' + ini + '</span>';
}

function setsHtml(s, lado) {
  const hist = s.historicoSets || [];
  let h = '';
  for (let i = 0; i < 3; i++) {
    const set = hist[i];
    const ganhou = set && (lado === 'A' ? set.a > set.b : set.b > set.a);
    const atual = !set && i === hist.length && s.status === 'em_andamento';
    h += '<i class="' + (ganhou ? 'won' : atual ? 'cur' : '') + '">' + (ganhou ? '✓ ' : '') + 'SET ' + (i + 1) + '</i>';
  }
  return h;
}

function quadraHtml(rot, capNum, lado) {
  const ordem = [4, 3, 2, 5, 6, 1];
  return ordem.map(pos => {
    const p = (rot || [])[pos - 1];
    if (!p || !p.nome) return '<div class="p vazio"></div>';
    const nome = String(p.nome).split(' ');
    const curto = nome.length > 1 ? nome[0] + ' ' + nome[nome.length - 1] : nome[0];
    const cap = capNum && p.numero && String(p.numero) === String(capNum);
    return '<div class="p' + (pos === 1 ? ' sq' : '') + '"><div class="n">' + esc(p.numero || '·') + '</div><div class="t">' + esc(curto) + '</div>' + (cap ? '<div class="c">C</div>' : '') + '</div>';
  }).join('');
}

let ultimo = null, tickerLista = [], tickerIdx = 0;
function eventosDe(s) {
  const nm = (l) => l === 'A' ? s.equipeCasa : s.equipeVisitante;
  const ev = [];
  (s.substituicoes || []).slice(-2).forEach(b => ev.push('🔁 SUBSTITUIÇÃO · ' + nm(b.equipe) + ' · SAI ' + b.saiu + ' · ENTRA ' + b.entrou));
  (s.cartoes || []).slice(-2).forEach(c => ev.push((c.tipo === 'Vermelho' ? '🟥 CARTÃO VERMELHO · ' : '🟨 CARTÃO AMARELO · ') + String(c.jogador).replace(/^\d+\s*-\s*/, '') + ' (' + nm(c.equipe) + ')'));
  (s.timeouts || []).slice(-2).forEach(t => ev.push('⏱ TEMPO TÉCNICO · ' + nm(t.equipe) + ' · SET ' + t.set));
  return ev;
}

function render(s) {
  const fin = s.status === 'finalizada' || s.status === 'sets_completos';
  $('onde').textContent = 'VÔLEI · JOGO ' + (s.id || '');
  $('rodada').textContent = s.setAtual > 3 || fin ? 'FIM DE JOGO' : 'SET ' + Math.min(s.setAtual, 3) + ' EM ANDAMENTO';
  const selo = $('selo'); selo.classList.toggle('fim', fin); $('seloTxt').textContent = fin ? 'ENCERRADO' : 'AO VIVO';
  $('nomeA').textContent = s.equipeCasa; $('nomeB').textContent = s.equipeVisitante;
  $('ccNomeA').textContent = s.equipeCasa; $('ccNomeB').textContent = s.equipeVisitante;
  $('escA').innerHTML = escudoHtml(s.equipeCasa); $('escB').innerHTML = escudoHtml(s.equipeVisitante);
  $('setsA').innerHTML = setsHtml(s, 'A'); $('setsB').innerHTML = setsHtml(s, 'B');
  $('tA').classList.toggle('serve', !fin && s.sacando === 'A'); $('tB').classList.toggle('serve', !fin && s.sacando === 'B');
  $('setlbl').textContent = fin ? 'FINAL' : 'SET ' + Math.min(s.setAtual, 3);
  const pa = fin ? ((s.historicoSets || []).slice(-1)[0] || {}).a : s.pontosCasa;
  const pb = fin ? ((s.historicoSets || []).slice(-1)[0] || {}).b : s.pontosVisitante;
  setPlacar('pA', pa == null ? 0 : pa); setPlacar('pB', pb == null ? 0 : pb);
  $('setsGrande').innerHTML = 'SETS <em>' + s.setsCasa + '</em> × <em>' + s.setsVisitante + '</em>';
  $('parc').textContent = (s.historicoSets || []).map((x, i) => 'SET ' + (i + 1) + ': ' + x.a + '×' + x.b).join('   ·   ');
  $('qA').innerHTML = quadraHtml(s.rotacaoCasa, s.capitaoQuadraCasa || s.capitaoCasa, 'A');
  $('qB').innerHTML = quadraHtml(s.rotacaoVisitante, s.capitaoQuadraVisitante || s.capitaoVisitante, 'B');
  $('arb').textContent = [s.arbitro1, s.arbitro2].filter(Boolean).length ? 'ÁRBITROS: ' + [s.arbitro1, s.arbitro2].filter(Boolean).join(' E ').toUpperCase() : '';
  tickerLista = eventosDe(s);
  if (!tickerLista.length) $('ev').textContent = fin ? 'Partida encerrada' : 'Partida em andamento';
}
function setPlacar(id, v) {
  const el = $(id);
  if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

setInterval(() => {
  if (!tickerLista.length) return;
  const el = $('ev'); el.classList.add('off');
  setTimeout(() => { tickerIdx = (tickerIdx + 1) % tickerLista.length; el.textContent = tickerLista[tickerIdx]; el.classList.remove('off'); }, 400);
}, 5000);

let ovTimer = null;
function overlay(id, ms) {
  const el = $(id); el.classList.add('on');
  clearTimeout(ovTimer);
  ovTimer = setTimeout(() => el.classList.remove('on'), ms);
}
function anunciar(antes, s) {
  if (!antes) return;
  const totalAntes = antes.setsCasa + antes.setsVisitante, total = s.setsCasa + s.setsVisitante;
  const fin = s.status === 'finalizada' || s.status === 'sets_completos';
  const finAntes = antes.status === 'finalizada' || antes.status === 'sets_completos';
  if (fin && !finAntes) {
    const venc = s.setsCasa > s.setsVisitante ? s.equipeCasa : s.equipeVisitante;
    $('ovFimBig').textContent = venc;
    $('ovFimSub').textContent = s.setsCasa + ' × ' + s.setsVisitante + ' em sets · ' + (s.historicoSets || []).map(x => x.a + '×' + x.b).join('  ·  ');
    overlay('ovFim', 22000); confete(22000);
  } else if (total > totalAntes) {
    const u = (s.historicoSets || []).slice(-1)[0] || { a: 0, b: 0 };
    const venc = u.a > u.b ? s.equipeCasa : s.equipeVisitante;
    $('ovSetK').textContent = 'SET ' + s.historicoSets.length + ' PARA';
    $('ovSetBig').textContent = venc;
    $('ovSetSub').textContent = s.equipeCasa + '  ' + u.a + ' × ' + u.b + '  ' + s.equipeVisitante;
    overlay('ovSet', 7000);
  }
}

function confete(ms) {
  const c = $('conf'), x = c.getContext('2d');
  const cores = ['#F4C542', '#2f86ff', '#ff8a1f', '#ffffff', '#22c55e'];
  const ps = Array.from({ length: 220 }, () => ({ x: Math.random() * 1920, y: -Math.random() * 1080, v: 3 + Math.random() * 6, r: 6 + Math.random() * 10, c: cores[(Math.random() * cores.length) | 0], a: Math.random() * 6, w: Math.random() * .2 - .1 }));
  const fim = Date.now() + ms;
  (function f() {
    x.clearRect(0, 0, 1920, 1080);
    if (Date.now() > fim) return;
    ps.forEach(p => { p.y += p.v; p.a += p.w; p.x += Math.sin(p.a) * 2; if (p.y > 1100) p.y = -20; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    requestAnimationFrame(f);
  })();
}

/* modo espera */
async function mostrarEspera() {
  $('jogo').style.display = 'none'; $('idle').classList.add('on');
  $('onde').textContent = 'VÔLEI'; $('rodada').textContent = 'PRÓXIMO JOGO EM BREVE';
  $('selo').classList.add('fim'); $('seloTxt').textContent = 'INTERVALO';
  let lista = [];
  try { lista = ((await fetch(SCRIPT_URL + '?action=partidasFinalizadas').then(r => r.json())) || {}).partidas || []; } catch (e) {}
  if (DEMO) lista = [{ equipeCasa: 'ES VÔLEI', equipeVisitante: 'CT DAS MONTANHAS', setsCasa: 2, setsVisitante: 0 }, { equipeCasa: 'AFC VÔLEI', equipeVisitante: 'SERRANA', setsCasa: 1, setsVisitante: 2 }, { equipeCasa: 'MONTANHAS', equipeVisitante: 'UNIÃO', setsCasa: 2, setsVisitante: 1 }];
  $('resultados').innerHTML = lista.length ? lista.slice(0, 5).map(p => '<div class="res"><span class="a ' + (p.setsCasa > p.setsVisitante ? 'w' : 'l') + '">' + esc(p.equipeCasa) + '</span><span class="sc">' + p.setsCasa + ' × ' + p.setsVisitante + '</span><span class="' + (p.setsVisitante > p.setsCasa ? 'w' : 'l') + '">' + esc(p.equipeVisitante) + '</span></div>').join('') : '<div class="vazio-msg">Os resultados aparecem aqui assim que os jogos terminarem.</div>';
  desenharQr();
}
let qrOk = false;
function desenharQr() {
  if (qrOk) return;
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload = () => {
    const qr = qrcode(0, 'M'); qr.addData(APP_URL); qr.make();
    const n = qr.getModuleCount(), cs = Math.floor(440 / n), c = $('qr');
    c.width = c.height = n * cs; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#0a1530';
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) x.fillRect(q * cs, r * cs, cs, cs);
    qrOk = true;
  };
  document.head.appendChild(s);
}
function mostrarJogo() { $('jogo').style.display = ''; $('idle').classList.remove('on'); }

/* dados */
async function buscarJogo() {
  if (FORCE_ID) {
    const r = await fetch(SCRIPT_URL + '?action=partida&id=' + encodeURIComponent(FORCE_ID)).then(x => x.json());
    return r && r.ok ? r.estado : null;
  }
  const l = await fetch(SCRIPT_URL + '?action=partidasAoVivo').then(x => x.json());
  const ps = (l && l.partidas) || [];
  if (!ps.length) return null;
  const idx = Math.floor(Date.now() / 20000) % ps.length;
  const r = await fetch(SCRIPT_URL + '?action=partida&id=' + encodeURIComponent(ps[idx].id)).then(x => x.json());
  return r && r.ok ? r.estado : null;
}
let idAtual = '';
async function ciclo() {
  try {
    const s = await buscarJogo();
    if (!s) { ultimo = null; mostrarEspera(); return; }
    mostrarJogo();
    const antes = (ultimo && ultimo.id === s.id) ? ultimo : null;
    render(s); anunciar(antes, s); ultimo = s;
  } catch (e) { /* mantém a última tela */ }
}

  else if (Q.get('demo') === 'set') { $('ovSetK').textContent = 'SET 1 PARA'; $('ovSetBig').textContent = s.equipeCasa; $('ovSetSub').textContent = 'ES VÔLEI  25 × 20  CT DAS MONTANHAS'; $('ovSet').classList.add('on'); }
  else setInterval(() => { if (Math.random() < .5) s.pontosCasa++; else s.pontosVisitante++; s.sacando = Math.random() < .5 ? 'A' : 'B'; render(s); }, 2500);

carregarEscudos().then(() => {

});
