<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>SUPERCOPA AFC 2026 — Telão</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:wght@900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--azul:#2336c4;--azul2:#16239a;--laranja:#d9441f;--tinta:#14206b}
html,body{height:100%;background:#0b0f2e;overflow:hidden;font-family:'Bebas Neue',Impact,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#e3e3e5;overflow:hidden}
#bgc{position:absolute;inset:0}

/* título */
.titulo{position:absolute;left:0;right:0;top:18px;text-align:center;font-family:'Playfair Display',Georgia,serif;font-weight:900;color:var(--azul);line-height:1;letter-spacing:-2px}
.titulo .g{font-size:168px}
.titulo .p{font-size:58px;vertical-align:56px;margin:0 8px}
.titulo .pt{display:inline-flex;align-items:center;gap:22px}
.titulo .dot{display:inline-block;width:44px;height:44px;border-radius:50%;background:#e11d1d;box-shadow:0 0 0 0 rgba(225,29,29,.6);animation:pulso 1.6s infinite;margin-right:18px}
@keyframes pulso{70%{box-shadow:0 0 0 24px rgba(225,29,29,0)}100%{box-shadow:0 0 0 0 rgba(225,29,29,0)}}
.sub{position:absolute;left:0;right:0;top:218px;text-align:center;font-size:46px;letter-spacing:9px;color:var(--tinta)}
.sub b{color:var(--laranja);font-weight:400}

/* placar */
.faixa{position:absolute;left:250px;width:1420px;top:468px;height:240px;background:var(--azul2);box-shadow:0 14px 40px rgba(10,15,60,.35)}
.esc{position:absolute;top:34px;width:172px;height:172px;border-radius:50%;background:#fff;box-shadow:0 0 0 8px #fff,0 10px 26px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
.esc.a{left:48px}.esc.b{right:48px}
.esc img{width:100%;height:100%;object-fit:cover}
.esc span{font-size:84px;color:var(--azul2)}
.quadrado{position:absolute;left:600px;width:720px;top:340px;height:470px;background:var(--azul);box-shadow:0 20px 50px rgba(10,15,60,.45);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.quadrado::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px)}
.num{display:flex;align-items:center;justify-content:center;line-height:.85;position:relative}
.num b{font-weight:400;font-size:400px;min-width:250px;text-align:center}
.num s{text-decoration:none;font-size:90px;margin:0 6px;opacity:.95;transform:translateY(34px)}
.num b.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.35);color:#ffe28a}100%{transform:scale(1)}}
.qinfo{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-size:42px;letter-spacing:6px;color:#dfe5ff}
.qinfo b{color:#fff;font-weight:400}
.nome{position:absolute;top:714px;width:430px;text-align:center;font-size:56px;letter-spacing:2px;color:var(--tinta);line-height:1}
.nome.a{left:169px}.nome.b{left:1321px}
.saque{display:inline-block;background:var(--laranja);color:#fff;font-size:30px;letter-spacing:4px;padding:3px 16px;margin-left:10px;vertical-align:8px;animation:pulo 1.1s ease-in-out infinite}
.saque.off{display:none}
@keyframes pulo{50%{transform:translateY(-7px)}}

/* escalações */
.esc-lista{position:absolute;top:790px;width:520px}
.esc-lista.a{left:285px}.esc-lista.b{left:1170px}
.esc-lista h5{font-weight:400;font-size:40px;letter-spacing:4px;border-bottom:5px solid var(--azul);display:inline-block;margin-bottom:8px;padding-right:20px}
.esc-lista.b h5{border-color:var(--laranja)}
.esc-lista .l{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;font-size:38px;letter-spacing:2px;line-height:1.2}
.esc-lista .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.esc-lista .l div.s{color:var(--laranja)}
.esc-lista .l em{font-style:normal;color:var(--azul);margin-right:6px}
.esc-lista.b .l em{color:var(--laranja)}
.centro-baixo{position:absolute;top:836px;left:740px;width:440px;text-align:center}
.centro-baixo .parc{font-size:44px;letter-spacing:4px;line-height:1.2;color:var(--tinta)}
.centro-baixo .parc.v{color:var(--laranja);font-size:54px;display:none}
.fim .centro-baixo .parc.v{display:block}
.lance{margin-top:12px;font-size:32px;letter-spacing:3px;color:var(--azul2);transition:opacity .4s;min-height:40px}
.lance.off{opacity:0}
.arb{position:absolute;bottom:60px;left:0;right:0;text-align:center;font-size:28px;letter-spacing:5px;color:var(--azul2)}

/* overlays */
.setov{position:absolute;left:0;right:0;top:360px;height:360px;background:var(--azul);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 14px #fff,0 30px 80px rgba(0,0,0,.5)}
.setov.on{display:flex;animation:entra .5s both}
@keyframes entra{from{transform:translateX(-120%)}to{transform:none}}
.setov .k{font-size:54px;letter-spacing:12px;color:#ffe28a}
.setov .big{font-family:'Playfair Display',serif;font-weight:900;font-size:150px;line-height:1.1}
.setov .s{font-size:60px;letter-spacing:6px}
canvas#conf{position:absolute;inset:0;z-index:40;pointer-events:none}
.rodape{position:absolute;bottom:0;left:0;right:0;height:46px;background:var(--azul2);color:#cdd6ff;display:flex;align-items:center;justify-content:center;gap:60px;font-size:26px;letter-spacing:7px}

/* espera */
.espera{display:none}
.on-espera .espera{display:block}
.on-espera .jogo{display:none}
.res{position:absolute;left:140px;top:330px;width:1040px;height:520px;background:var(--azul);box-shadow:0 20px 50px rgba(10,15,60,.45);color:#fff;padding:30px 44px}
.res h3{font-weight:400;font-size:64px;letter-spacing:6px;color:#ffe28a;margin-bottom:10px}
.res .r{display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:center;font-size:48px;letter-spacing:2px;padding:10px 0;border-top:3px solid rgba(255,255,255,.2)}
.res .r .a{text-align:right}.res .r .sc{font-size:66px;color:#ffe28a}
.res .r .l{opacity:.55}
.res .vz{font-size:44px;letter-spacing:3px;opacity:.85;padding-top:20px}
.qr{position:absolute;left:1260px;top:330px;width:520px;height:520px;background:#fff;box-shadow:0 20px 50px rgba(10,15,60,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.qr canvas{width:340px;height:340px}
.qr b{font-weight:400;font-size:52px;letter-spacing:3px;color:var(--azul)}
.qr span{font-size:32px;letter-spacing:3px;color:var(--tinta)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bgc" width="1920" height="1080"></canvas>

  <div class="titulo" id="titulo"></div>
  <div class="sub" id="sub"></div>

  <div class="jogo" id="jogo">
    <div class="faixa"><div class="esc a" id="escA"></div><div class="esc b" id="escB"></div></div>
    <div class="quadrado">
      <div class="num"><b id="pA">0</b><s>x</s><b id="pB">0</b></div>
      <div class="qinfo" id="qinfo"></div>
    </div>
    <div class="nome a" id="nomeA"></div><div class="nome b" id="nomeB"></div>
    <div class="esc-lista a" id="lstA"></div>
    <div class="esc-lista b" id="lstB"></div>
    <div class="centro-baixo"><div class="parc" id="parc"></div><div class="parc v" id="venc"></div><div class="lance" id="lance"></div></div>
    <div class="arb" id="arb"></div>
  </div>

  <div class="espera" id="espera">
    <div class="res"><h3>ÚLTIMOS RESULTADOS</h3><div id="resultados"></div></div>
    <div class="qr"><canvas id="qr" width="10" height="10"></canvas><b>ACOMPANHE PELO APP</b><span>PLACAR AO VIVO, SÚMULAS E MAIS</span></div>
  </div>

  <div class="setov" id="setov"><div class="k" id="setK"></div><div class="big" id="setBig"></div><div class="s" id="setS"></div></div>
  <canvas id="conf" width="1920" height="1080"></canvas>
  <div class="rodape"><span>SUPERCOPA AFC 2026</span><span>·</span><span>AFONSO CLÁUDIO-ES</span><span>·</span><span>SUPERCOPAAFC.COM.BR</span></div>
</div>

<script src="card-resultado.js"></script>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwTT4C5NQ6awTRsdzl-t__mKxK0LdMlUKoPVxla43Xj5k_BsKoS5PJGIk-4wNJuDe0Kw/exec";
const APP_URL = "https://drdiegopadua.github.io/supercopa-app/";
const Q = new URLSearchParams(location.search);
const FORCE_ID = (Q.get('jogo') || '').toUpperCase();
const DEMO = Q.has('demo');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080), st = $('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
  st.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

SC.fontes().then(() => { SC.fundo($('bgc').getContext('2d'), 1920, 1080, 5); });

let escudos = {};
async function carregarEscudos() {
  try {
    const r = await fetch(SCRIPT_URL + '?action=equipesComPin').then(x => x.json());
    ((r && r.equipes) || []).forEach(e => { if (e.escudo) escudos[String(e.equipe).toLowerCase()] = e.escudo; });
  } catch (e) {}
}
function escudoHtml(nome) {
  const u = escudos[String(nome).toLowerCase()], ini = SC.iniciais(nome);
  return u ? '<img src="' + esc(u) + '" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML=\'<span>' + ini + '</span>\'">' : '<span>' + ini + '</span>';
}

function titulo(modo) {
  const t = $('titulo');
  if (modo === 'fim') t.innerHTML = '<span class="g">FIM</span><span class="p">DE</span><span class="g">JOGO</span>';
  else if (modo === 'espera') t.innerHTML = '<span class="g">INTERVALO</span>';
  else t.innerHTML = '<span class="pt"><span class="dot"></span><span class="g">AO VIVO</span></span>';
}

function lista(rot, capNum, saqueOn) {
  return '<div class="l">' + [1, 2, 3, 4, 5, 6].map(pos => {
    const p = (rot || [])[pos - 1];
    if (!p || !p.nome) return '<div></div>';
    const nome = String(p.nome).toUpperCase().split(' ');
    const curto = nome.length > 1 ? nome[0] + ' ' + nome[nome.length - 1] : nome[0];
    const cap = capNum && p.numero && String(p.numero) === String(capNum);
    return '<div class="' + (pos === 1 && saqueOn ? 's' : '') + '"><em>' + esc(p.numero || '·') + '</em>' + esc(curto) + (cap ? ' (C)' : '') + (pos === 1 && saqueOn ? ' ●' : '') + '</div>';
  }).join('') + '</div>';
}

let ultimo = null, ticker = [], tIdx = 0;
function eventosDe(s) {
  const nm = (l) => l === 'A' ? s.equipeCasa : s.equipeVisitante;
  const ev = [];
  (s.substituicoes || []).slice(-2).forEach(b => ev.push('SUBSTITUIÇÃO · ' + nm(b.equipe) + ' · SAI ' + b.saiu + ' · ENTRA ' + b.entrou));
  (s.cartoes || []).slice(-2).forEach(c => ev.push((c.tipo === 'Vermelho' ? 'CARTÃO VERMELHO · ' : 'CARTÃO AMARELO · ') + String(c.jogador).replace(/^\d+\s*-\s*/, '') + ' (' + nm(c.equipe) + ')'));
  (s.timeouts || []).slice(-2).forEach(t => ev.push('TEMPO TÉCNICO · ' + nm(t.equipe) + ' · SET ' + t.set));
  return ev.map(x => x.toUpperCase());
}
function setNum(id, v) {
  const el = $(id);
  if (el.textContent !== String(v)) { el.textContent = v; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
}

function render(s) {
  document.body.classList.remove('on-espera');
  const fin = s.status === 'finalizada' || s.status === 'sets_completos';
  titulo(fin ? 'fim' : 'ao vivo');
  $('stage').classList.toggle('fim', fin);
  const hist = s.historicoSets || [];
  $('sub').innerHTML = 'VÔLEI · JOGO ' + esc(s.id || '') + (fin ? '' : ' · <b>SET ' + Math.min(s.setAtual, 3) + '</b>');
  $('escA').innerHTML = escudoHtml(s.equipeCasa); $('escB').innerHTML = escudoHtml(s.equipeVisitante);
  $('nomeA').innerHTML = esc(s.equipeCasa).toUpperCase() + '<span class="saque ' + (!fin && s.sacando === 'A' ? '' : 'off') + '">SAQUE</span>';
  $('nomeB').innerHTML = esc(s.equipeVisitante).toUpperCase() + '<span class="saque ' + (!fin && s.sacando === 'B' ? '' : 'off') + '">SAQUE</span>';
  if (fin) { setNum('pA', s.setsCasa); setNum('pB', s.setsVisitante); $('qinfo').innerHTML = 'PLACAR EM SETS'; }
  else { setNum('pA', s.pontosCasa); setNum('pB', s.pontosVisitante); $('qinfo').innerHTML = 'SETS <b>' + s.setsCasa + '</b> x <b>' + s.setsVisitante + '</b>'; }
  $('parc').innerHTML = hist.map((x, i) => (i + 1) + 'º SET &nbsp;' + x.a + ' x ' + x.b).join('<br>');
  $('venc').innerHTML = fin ? ((s.setsCasa > s.setsVisitante ? esc(s.equipeCasa) : esc(s.equipeVisitante)).toUpperCase() + ' VENCEU') : '';
  $('lstA').style.display = $('lstB').style.display = fin ? 'none' : '';
  $('lstA').innerHTML = '<h5>' + esc(s.equipeCasa).toUpperCase() + '</h5>' + lista(s.rotacaoCasa, s.capitaoQuadraCasa || s.capitaoCasa, s.sacando === 'A');
  $('lstB').innerHTML = '<h5>' + esc(s.equipeVisitante).toUpperCase() + '</h5>' + lista(s.rotacaoVisitante, s.capitaoQuadraVisitante || s.capitaoVisitante, s.sacando === 'B');
  const arbs = [s.arbitro1, s.arbitro2].filter(Boolean);
  $('arb').textContent = arbs.length ? 'ÁRBITROS: ' + arbs.join(' E ').toUpperCase() : '';
  ticker = eventosDe(s);
  $('lance').textContent = ticker.length ? ticker[tIdx % ticker.length] : '';
}

setInterval(() => {
  if (!ticker.length) return;
  const el = $('lance'); el.classList.add('off');
  setTimeout(() => { tIdx = (tIdx + 1) % ticker.length; el.textContent = ticker[tIdx]; el.classList.remove('off'); }, 400);
}, 5000);

let ovT = null;
function anunciar(antes, s) {
  if (!antes) return;
  const fin = s.status === 'finalizada' || s.status === 'sets_completos';
  const finAntes = antes.status === 'finalizada' || antes.status === 'sets_completos';
  if (fin && !finAntes) { confete(10000); return; }
  if (s.setsCasa + s.setsVisitante > antes.setsCasa + antes.setsVisitante) {
    const u = (s.historicoSets || []).slice(-1)[0] || { a: 0, b: 0 };
    $('setK').textContent = 'SET ' + s.historicoSets.length + ' PARA';
    $('setBig').textContent = u.a > u.b ? s.equipeCasa : s.equipeVisitante;
    $('setS').textContent = s.equipeCasa.toUpperCase() + '  ' + u.a + ' x ' + u.b + '  ' + s.equipeVisitante.toUpperCase();
    const el = $('setov'); el.classList.add('on'); clearTimeout(ovT); ovT = setTimeout(() => el.classList.remove('on'), 7000);
  }
}

function confete(ms) {
  const c = $('conf'), x = c.getContext('2d'), cores = ['#2336c4', '#d9441f', '#ffffff', '#16239a'];
  const ps = Array.from({ length: 200 }, () => ({ x: Math.random() * 1920, y: -Math.random() * 1080, v: 3 + Math.random() * 6, r: 8 + Math.random() * 12, c: cores[(Math.random() * cores.length) | 0], a: Math.random() * 6, w: Math.random() * .2 - .1 }));
  const fim = Date.now() + ms;
  (function f() {
    x.clearRect(0, 0, 1920, 1080);
    if (Date.now() > fim) return;
    ps.forEach(p => { p.y += p.v; p.a += p.w; p.x += Math.sin(p.a) * 2; if (p.y > 1100) p.y = -20; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
    requestAnimationFrame(f);
  })();
}

let qrOk = false;
function desenharQr() {
  if (qrOk) return;
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload = () => {
    const qr = qrcode(0, 'M'); qr.addData(APP_URL); qr.make();
    const n = qr.getModuleCount(), cs = Math.floor(400 / n), c = $('qr');
    c.width = c.height = n * cs; const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#14206b';
    for (let r = 0; r < n; r++) for (let q = 0; q < n; q++) if (qr.isDark(r, q)) x.fillRect(q * cs, r * cs, cs, cs);
    qrOk = true;
  };
  document.head.appendChild(s);
}
async function mostrarEspera() {
  document.body.classList.add('on-espera'); $('stage').classList.remove('fim');
  titulo('espera'); $('sub').textContent = 'VÔLEI · PRÓXIMO JOGO EM BREVE';
  let l = [];
  try { l = ((await fetch(SCRIPT_URL + '?action=partidasFinalizadas').then(r => r.json())) || {}).partidas || []; } catch (e) {}
  if (DEMO) l = [{ equipeCasa: 'ES VÔLEI', equipeVisitante: 'CT DAS MONTANHAS', setsCasa: 2, setsVisitante: 0 }, { equipeCasa: 'AFC VÔLEI', equipeVisitante: 'SERRANA', setsCasa: 1, setsVisitante: 2 }, { equipeCasa: 'MONTANHAS', equipeVisitante: 'UNIÃO', setsCasa: 2, setsVisitante: 1 }];
  $('resultados').innerHTML = l.length ? l.slice(0, 4).map(p => '<div class="r"><span class="a ' + (p.setsCasa > p.setsVisitante ? '' : 'l') + '">' + esc(p.equipeCasa).toUpperCase() + '</span><span class="sc">' + p.setsCasa + ' x ' + p.setsVisitante + '</span><span class="' + (p.setsVisitante > p.setsCasa ? '' : 'l') + '">' + esc(p.equipeVisitante).toUpperCase() + '</span></div>').join('') : '<div class="vz">OS RESULTADOS APARECEM AQUI QUANDO OS JOGOS TERMINAREM.</div>';
  desenharQr();
}

async function buscarJogo() {
  if (FORCE_ID) { const r = await fetch(SCRIPT_URL + '?action=partida&id=' + encodeURIComponent(FORCE_ID)).then(x => x.json()); return r && r.ok ? r.estado : null; }
  const l = await fetch(SCRIPT_URL + '?action=partidasAoVivo').then(x => x.json());
  const ps = (l && l.partidas) || [];
  if (!ps.length) return null;
  const r = await fetch(SCRIPT_URL + '?action=partida&id=' + encodeURIComponent(ps[Math.floor(Date.now() / 20000) % ps.length].id)).then(x => x.json());
  return r && r.ok ? r.estado : null;
}
async function ciclo() {
  try {
    const s = await buscarJogo();
    if (!s) { ultimo = null; mostrarEspera(); return; }
    const antes = (ultimo && ultimo.id === s.id) ? ultimo : null;
    render(s); anunciar(antes, s); ultimo = s;
  } catch (e) {}
}

function demo() {
  const J = (n, nome) => ({ numero: String(n), nome: nome });
  const A = ['Ana Souza', 'Bia Lima', 'Carla Dias', 'Duda Alves', 'Edna Reis', 'Fabi Costa'].map((n, i) => J(i + 1, n));
  const B = ['Gabi Rocha', 'Hana Melo', 'Isa Duarte', 'Jana Pires', 'Kátia Nunes', 'Lia Prado'].map((n, i) => J(i + 1, n));
  const s = { id: 'A2', equipeCasa: 'ES VÔLEI', equipeVisitante: 'CT DAS MONTANHAS', status: 'em_andamento', setAtual: 2, pontosCasa: 17, pontosVisitante: 14, setsCasa: 1, setsVisitante: 0, sacando: 'A', historicoSets: [{ a: 25, b: 20 }], rotacaoCasa: A, rotacaoVisitante: B, capitaoCasa: '3', capitaoVisitante: '3', arbitro1: 'Carlos Mesa', arbitro2: 'Ana Linha', timeouts: [{ equipe: 'B', set: 2 }], cartoes: [{ equipe: 'B', jogador: '3 - Isa Duarte', tipo: 'Amarelo', set: 1 }], substituicoes: [{ equipe: 'A', set: 1, saiu: 'Fabi Costa', entrou: 'Mari Luz' }] };
  const m = Q.get('demo');
  if (m === 'fim') { s.status = 'sets_completos'; s.setsCasa = 2; s.historicoSets.push({ a: 25, b: 21 }); render(s); }
  else if (m === 'espera') mostrarEspera();
  else { render(s); setInterval(() => { if (Math.random() < .5) s.pontosCasa++; else s.pontosVisitante++; s.sacando = Math.random() < .5 ? 'A' : 'B'; render(s); }, 2500); }
  ultimo = s;
}

/* tecla C = baixa o card do resultado do jogo em tela (1080x1080) */
addEventListener('keydown', async (e) => {
  if ((e.key || '').toLowerCase() !== 'c' || !ultimo) return;
  const s = ultimo, fin = s.status === 'finalizada' || s.status === 'sets_completos';
  const cv = document.createElement('canvas');
  await SC.card(cv, { titulo: fin ? 'FIM DE JOGO' : 'AO VIVO', equipeA: s.equipeCasa.toUpperCase(), equipeB: s.equipeVisitante.toUpperCase(), placarA: fin ? s.setsCasa : s.pontosCasa, placarB: fin ? s.setsVisitante : s.pontosVisitante, escudoA: escudos[s.equipeCasa.toLowerCase()], escudoB: escudos[s.equipeVisitante.toLowerCase()], linhas: [fin ? ((s.setsCasa > s.setsVisitante ? s.equipeCasa : s.equipeVisitante).toUpperCase() + ' VENCEU') : 'SET ' + Math.min(s.setAtual, 3)].concat((s.historicoSets || []).map((x, i) => (i + 1) + 'º SET  ' + x.a + ' x ' + x.b)) });
  const a = document.createElement('a'); a.download = 'card-jogo-' + s.id + '.png'; a.href = cv.toDataURL('image/png'); a.click();
});

carregarEscudos().then(() => {
  if (DEMO) { demo(); return; }
  ciclo(); setInterval(ciclo, 15000);
});
</script>
